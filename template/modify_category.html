<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Category</title>
    <link rel="stylesheet" href="../dist/output.css">
</head>

<body>
    <div class=" bg-[#0A3D2F] min-h-screen text-white flex flex-col gap-10">
        <div class="w-full py-7 px-8 text-white flex justify-between items-center">

            <div class="flex items-center gap-4">
                <div class="border rounded-3xl p-2  bg-green-400 hover:bg-green-500">
                    <svg id="ham" class="cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                        viewBox="0 0 16 16">
                        <title xmlns="">hamburger</title>
                        <path fill="currentColor" fill-rule="evenodd"
                            d="M0 3.75A.75.75 0 0 1 .75 3h14.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 3.75M0 8a.75.75 0 0 1 .75-.75h14.5a.75.75 0 0 1 0 1.5H.75A.75.75 0 0 1 0 8m.75 3.5a.75.75 0 0 0 0 1.5h14.5a.75.75 0 0 0 0-1.5z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="border rounded-3xl p-1 ">
                    EN
                </div>
            </div>

            <div class="flex gap-2">
                <div class="bold text-4xl items-center">
                    { / }
                </div>
                <div class="justify-start font-medium">
                    <div class="text-white">Expert</div>
                    <div class="text-white">Tech Group</div>
                </div>
            </div>

            <div class="flex items-center ">
                <div class="border rounded-3xl p-2">
                    <img src="../icon_2/user-circle.svg" alt="user">
                </div>
            </div>

        </div>
        <div class="">
            <div class="text-white text-4xl flex gap-20 justify-center items-center font-medium">
                <a id="backLink" href="./category.html" class="cursor-pointer">
                    <img src="../icon_2/arrow-left-02-sharp.svg" alt="back">
                </a>
                <span>
                    Modify Catergory
                </span>
            </div>
            <div id="previewLabel" class="text-white my-5 text-lg flex gap-5 justify-center font-medium">Preview</div>
        </div>
        <div class="mx-auto w-full max-w-2xl px-8">
            <div class="border border-[#009E8E33] bg-[#009E8E1A] p-3 rounded-lg">
                <div id="previewCard" class="flex gap-2">
                    <img id="previewIcon" src="../icon/Frame 1000004748 (1).svg" class="w-7 h-7" alt="category icon">
                    <div id="previewName" class="text-green-500 justify-center font-medium">Catergory</div>
                </div>
            </div>
            <div class="flex gap-3 my-5">
                <div class="relative flex-1">
                    <span class="absolute left-1 top-1">
                        <img src="../icon_2/plus-sign.svg" alt="plus-sign">
                    </span>
                    <input id="iconInput" type="text" placeholder="Add icon"
                        class="w-full p-2 pl-8 text-white bg-transparent border rounded-lg border-white">
                </div>
                <div class="text-white flex-1">
                    <input id="nameInput" type="text"
                        class="w-full p-2 pl-4 text-white bg-transparent border rounded-lg border-white"
                        placeholder="Enter the Service name">
                </div>
            </div>
            <p id="formMessage" class="text-red-400 text-sm mb-3 hidden"></p>
            <button
                id="submitModifyBtn"
                type="button"
                class="w-full bg-green-400 hover:bg-green-500 text-white font-semibold py-4 rounded-lg transition-all shadow-[0_0_20px_rgba(0,163,141,0.4)]">Add
            </button>
        </div>
    </div>
    <script src="../JsFunction/modify_category.js" defer></script>
</body>

</html>
